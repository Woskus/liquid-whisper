<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Ustawienia</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0c10;
    --card: rgba(255, 255, 255, 0.045);
    --card-border: rgba(255, 255, 255, 0.08);
    --text: #eceef2;
    --dim: #8b90a0;
    --faint: #565b6a;
    --chrome: linear-gradient(180deg, #ffffff, #9aa4b8);
    --ok: #b7e3ba;
    --warn: #ff9d94;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 22px 26px;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, 'SF Pro Text', sans-serif;
    user-select: none;
  }

  header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .logo-bars { display: flex; align-items: center; gap: 3px; height: 20px;
               padding: 0 9px; border-radius: 10px;
               background: rgba(255,255,255,0.06); }
  .logo-bars i { width: 2.5px; border-radius: 2px; background: var(--chrome); }
  .logo-bars i:nth-child(1) { height: 6px; }
  .logo-bars i:nth-child(2) { height: 11px; }
  .logo-bars i:nth-child(3) { height: 14px; }
  .logo-bars i:nth-child(4) { height: 11px; }
  .logo-bars i:nth-child(5) { height: 6px; }
  header .title {
    font-size: 14px; font-weight: 600; letter-spacing: 0.02em;
    background: var(--chrome); -webkit-background-clip: text; color: transparent;
  }

  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
       color: var(--dim); margin: 22px 0 8px; font-weight: 600; }
  .hint { color: var(--faint); font-size: 11.5px; margin-top: 6px; }
  .hint code { color: var(--dim); font-family: 'SF Mono', ui-monospace, monospace; font-size: 10.5px; }
  .warn { color: var(--warn); }

  select {
    width: 100%; appearance: none; -webkit-appearance: none;
    background: var(--card) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M1 1l4 4 4-4" stroke="%238b90a0" fill="none" stroke-width="1.5" stroke-linecap="round"/></svg>') no-repeat right 14px center;
    border: 1px solid var(--card-border); border-radius: 12px;
    color: var(--text); padding: 8px 34px 8px 14px; font: inherit; outline: none;
    cursor: pointer;
  }
  select:focus { border-color: rgba(255,255,255,0.25); }

  textarea {
    width: 100%; min-height: 220px; resize: vertical;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 12px; color: var(--text); padding: 10px 14px;
    font: 11.5px/1.5 'SF Mono', ui-monospace, monospace; outline: none;
    user-select: text;
  }
  textarea:focus { border-color: rgba(255,255,255,0.25); }

  button {
    border: 1px solid var(--card-border); border-radius: 999px;
    padding: 6px 16px; cursor: pointer; font-size: 12.5px;
    background: rgba(255,255,255,0.06); color: var(--text);
    transition: background 0.12s ease;
  }
  button:hover { background: rgba(255,255,255,0.12); }
  button.primary { border-color: rgba(183,227,186,0.3); color: var(--ok); font-weight: 600; }
  button.primary:hover { background: rgba(183,227,186,0.12); }
  button.ghost { border: 0; background: transparent; color: var(--faint); }
  button.ghost:hover { color: var(--text); background: transparent; }

  footer { display: flex; align-items: center; gap: 10px; margin-top: 22px; }
  #status { font-size: 12px; color: var(--ok); opacity: 0; transition: opacity 0.25s ease; }
  #status.show { opacity: 1; }
  #status.error { color: var(--warn); }
</style>
</head>
<body>
  <header>
    <span class="logo-bars"><i></i><i></i><i></i><i></i><i></i></span>
    <span class="title">Liquid Whisper — ustawienia</span>
  </header>

  <h2>Przycisk nagrywania</h2>
  <select id="hotkey"></select>
  <div class="hint">Przytrzymaj = push-to-talk, dwuklik = nagrywanie ciągłe. Działa od razu po zapisaniu.</div>

  <h2>Model cleanup (Ollama)</h2>
  <select id="model"></select>
  <div class="hint" id="model-hint"></div>

  <h2>Prompt cleanupu</h2>
  <textarea id="prompt" spellcheck="false"></textarea>
  <div class="hint">Znaczniki <code>{dictionary}</code> i <code>{corrections}</code> zostaną podmienione
    na terminy i poprawki ze słowniczka — zostaw je w prompcie.</div>

  <footer>
    <button class="primary" id="save">Zapisz</button>
    <button class="ghost" id="reset-prompt">Przywróć domyślny prompt</button>
    <span id="status"></span>
  </footer>

<script>
const $ = (id) => document.getElementById(id);

const KEY_LABELS = {
  ctrl_r: 'Prawy Control (⌃)', ctrl_l: 'Lewy Control (⌃)',
  alt_r: 'Prawy Option (⌥)', alt_l: 'Lewy Option (⌥)',
  cmd_r: 'Prawy Command (⌘)', cmd_l: 'Lewy Command (⌘)',
  shift_r: 'Prawy Shift (⇧)', shift_l: 'Lewy Shift (⇧)',
};

let defaultPrompt = '';

function render(data) {
  if (data.error) { flash(data.error, true); return; }
  defaultPrompt = data.default_prompt;

  const hk = $('hotkey');
  hk.innerHTML = '';
  for (const key of data.hotkeys) {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = KEY_LABELS[key] || key.toUpperCase();
    hk.append(opt);
  }
  hk.value = data.hotkey;

  const sel = $('model');
  sel.innerHTML = '';
  const models = [...data.models];
  if (data.model && !models.includes(data.model)) models.unshift(data.model);
  for (const m of models) {
    const opt = document.createElement('option');
    opt.value = m;
    // dopisek tylko gdy Ollama faktycznie odpowiedziała i modelu brak na liście
    opt.textContent = m + (data.ollama_ok && !data.models.includes(m) ? ' (niezainstalowany)' : '');
    sel.append(opt);
  }
  sel.value = data.model;

  const hint = $('model-hint');
  if (!data.ollama_ok) {
    hint.innerHTML = '<span class="warn">Ollama nie odpowiada</span> — lista pokazuje tylko model zapisany w konfiguracji. Uruchom Ollamę i otwórz to okno ponownie.';
  } else if (!data.models.includes(data.model)) {
    hint.innerHTML = `Zapisany model nie jest zainstalowany — pobierz go: <code>ollama pull ${data.model}</code>`;
  } else {
    hint.textContent = 'Lista modeli zainstalowanych w Ollamie. Nowy model doinstalujesz przez „ollama pull …".';
  }

  $('prompt').value = data.prompt;
}

let statusTimer;
function flash(msg, error = false) {
  const st = $('status');
  st.textContent = msg;
  st.className = 'show' + (error ? ' error' : '');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { st.className = ''; }, 2500);
}

$('save').onclick = async () => {
  const data = await window.pywebview.api.save($('hotkey').value, $('model').value, $('prompt').value);
  render(data);
  if (!data.error) flash('Zapisano — działa od teraz ✓');
};

$('reset-prompt').onclick = () => {
  $('prompt').value = defaultPrompt;
  flash('Przywrócono domyślny prompt — kliknij Zapisz');
};

window.addEventListener('pywebviewready', async () => render(await window.pywebview.api.get_data()));
</script>
</body>
</html>
