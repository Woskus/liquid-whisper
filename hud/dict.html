<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Słowniczek</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0c10;
    --card: rgba(255, 255, 255, 0.045);
    --card-border: rgba(255, 255, 255, 0.08);
    --text: #eceef2;
    --dim: #8b90a0;
    --faint: #565b6a;
    --chrome: linear-gradient(180deg, #ffffff, #9aa4b8);
    --wrong: #ff9d94;
    --correct: #b7e3ba;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 22px 26px;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, 'SF Pro Text', sans-serif;
    user-select: none;
  }

  header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .logo-bars { display: flex; align-items: center; gap: 3px; height: 20px;
               padding: 0 9px; border-radius: 10px;
               background: rgba(255,255,255,0.06); }
  .logo-bars i { width: 2.5px; border-radius: 2px; background: var(--chrome); }
  .logo-bars i:nth-child(1) { height: 6px; }
  .logo-bars i:nth-child(2) { height: 11px; }
  .logo-bars i:nth-child(3) { height: 14px; }
  .logo-bars i:nth-child(4) { height: 11px; }
  .logo-bars i:nth-child(5) { height: 6px; }
  header .title {
    font-size: 14px; font-weight: 600; letter-spacing: 0.02em;
    background: var(--chrome); -webkit-background-clip: text; color: transparent;
  }

  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
       color: var(--dim); margin: 22px 0 8px; font-weight: 600; }
  .empty { color: var(--faint); font-style: italic; padding: 2px 2px; }

  .row {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 12px; margin-bottom: 6px;
  }
  .row .wrong { color: var(--wrong); }
  .row .arrow { color: var(--faint); }
  .row .correct { color: var(--correct); }
  .row .count { color: var(--faint); font-size: 11px; margin-left: auto; }
  .row .grow { flex: 1; }

  button {
    border: 1px solid var(--card-border); border-radius: 999px;
    padding: 4px 11px; cursor: pointer; font-size: 12px;
    background: rgba(255,255,255,0.06); color: var(--text);
    transition: background 0.12s ease;
  }
  button:hover { background: rgba(255,255,255,0.12); }
  button.ok { border-color: rgba(183,227,186,0.25); color: var(--correct); }
  button.ok:hover { background: rgba(183,227,186,0.12); }
  button.no { border-color: rgba(255,157,148,0.22); color: var(--wrong); padding: 4px 9px; }
  button.no:hover { background: rgba(255,157,148,0.1); }
  button.x { border: 0; background: transparent; color: var(--faint); padding: 2px 5px; }
  button.x:hover { color: var(--wrong); background: transparent; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 2px;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 999px; padding: 3px 4px 3px 12px;
  }

  form.add { display: flex; gap: 6px; margin-top: 10px; }
  input {
    flex: 1; background: rgba(255,255,255,0.05);
    border: 1px solid var(--card-border); border-radius: 999px;
    color: var(--text); padding: 5px 12px; font: inherit; outline: none;
  }
  input::placeholder { color: var(--faint); }
  input:focus { border-color: rgba(255,255,255,0.25); }
</style>
</head>
<body>
  <header>
    <span class="logo-bars"><i></i><i></i><i></i><i></i><i></i></span>
    <span class="title">Liquid Whisper — słowniczek</span>
  </header>

  <h2>Propozycje z dyktand</h2>
  <div id="suggestions"></div>

  <h2>Poprawki (usłyszane → poprawne)</h2>
  <div id="corrections"></div>
  <form class="add" id="corr-form">
    <input id="corr-wrong" placeholder="usłyszane, np. bac clock" />
    <input id="corr-correct" placeholder="poprawne, np. backlog" />
    <button type="submit">Dodaj</button>
  </form>

  <h2>Terminy</h2>
  <div class="chips" id="terms"></div>
  <form class="add" id="term-form">
    <input id="term-input" placeholder="nowy termin, np. kubernetes" />
    <button type="submit">Dodaj</button>
  </form>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(data) {
  const sug = $('suggestions');
  sug.innerHTML = data.suggestions.length ? '' : '<div class="empty">Brak propozycji — pojawią się po kolejnych dyktandach.</div>';
  for (const s of data.suggestions) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span class="wrong">${esc(s.wrong)}</span><span class="arrow">→</span>` +
      `<span class="correct grow">${esc(s.correct)}</span><span class="count">×${s.count}</span>`;
    const ok = document.createElement('button'); ok.className = 'ok'; ok.textContent = '✓ do słowniczka';
    ok.onclick = () => call('accept_suggestion', s.wrong, s.correct);
    const no = document.createElement('button'); no.className = 'no'; no.textContent = '✕';
    no.onclick = () => call('reject_suggestion', s.wrong);
    row.append(ok, no); sug.append(row);
  }

  const corr = $('corrections');
  const entries = Object.entries(data.corrections);
  corr.innerHTML = entries.length ? '' : '<div class="empty">Brak wpisów.</div>';
  for (const [w, c] of entries) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span class="wrong">${esc(w)}</span><span class="arrow">→</span>` +
      `<span class="correct grow">${esc(c)}</span>`;
    const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕';
    x.onclick = () => call('remove_correction', w);
    row.append(x); corr.append(row);
  }

  const terms = $('terms');
  terms.innerHTML = data.terms.length ? '' : '<div class="empty">Brak terminów.</div>';
  for (const t of data.terms) {
    const chip = document.createElement('span');
    chip.className = 'chip'; chip.textContent = t;
    const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕';
    x.onclick = () => call('remove_term', t);
    chip.append(x); terms.append(chip);
  }
}

async function call(method, ...args) {
  render(await window.pywebview.api[method](...args));
}

$('corr-form').onsubmit = (e) => {
  e.preventDefault();
  const w = $('corr-wrong').value.trim(), c = $('corr-correct').value.trim();
  if (w && c) { call('add_correction', w, c); $('corr-wrong').value = ''; $('corr-correct').value = ''; }
};
$('term-form').onsubmit = (e) => {
  e.preventDefault();
  const t = $('term-input').value.trim();
  if (t) { call('add_term', t); $('term-input').value = ''; }
};

window.addEventListener('pywebviewready', () => call('get_data'));
</script>
</body>
</html>
